name: Build latest PrefabScan package

on:
  push:
    branches:
      - build/prefabscan-package2
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PrefabScan.sln
      - name: Test application
        run: dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --configuration Release --no-restore
      - name: Test domain
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --configuration Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish src/SewerScan.UI/SewerScan.UI.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath PrefabScan_LATEST_Windows_x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PrefabScan_LATEST_Windows_x64
          path: PrefabScan_LATEST_Windows_x64.zip
          compression-level: 0
