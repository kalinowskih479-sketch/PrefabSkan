name: Build PrefabScan 4.2.5

on:
  push:
    branches:
      - fix/prefabscan-4.2.5
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run application tests
        run: dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --configuration Release
      - name: Run domain tests
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --configuration Release
      - name: Publish Windows x64
        run: dotnet publish src/SewerScan.UI/SewerScan.UI.csproj -c Release -r win-x64 --self-contained true -o publish/PrefabScan_4.2.5
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/PrefabScan_4.2.5/* -DestinationPath PrefabScan_4.2.5_Windows_x64.zip -Force
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PrefabScan_4.2.5_Windows_x64
          path: PrefabScan_4.2.5_Windows_x64.zip
