name: Apply PrefabScan 4.2.4 resolver patch

on:
  push:
    branches:
      - sync/prefabscan-4.2.2
    paths:
      - 'tools/patch_424.py'
      - '.github/workflows/apply-424.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync/prefabscan-4.2.2
          fetch-depth: 0

      - name: Apply 4.2.4 patch
        run: python3 tools/patch_424.py

      - name: Commit source change
        run: |
          git config user.name "PrefabScan CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/SewerScan.Infrastructure/Parsers/SewerProjectParser.cs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: prefer network family in profile resolver"
            git push origin HEAD:sync/prefabscan-4.2.2
          fi
