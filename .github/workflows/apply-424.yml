name: Build PrefabScan 4.2.4

on:
  push:
    branches:
      - fix/prefabscan-4.2.4-work
    paths:
      - 'tools/patch_424.py'
      - '.github/workflows/apply-424.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/prefabscan-4.2.4-work
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply 4.2.4 repeated-level patch
        shell: pwsh
        run: python tools/patch_424.py

      - name: Commit source patch
        shell: pwsh
        run: |
          git config user.name "PrefabScan CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/SewerScan.Infrastructure/Parsers/SewerProjectParser.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: recover repeated displaced PZT elevation pairs"
            git push origin HEAD:fix/prefabscan-4.2.4-work
          }

      - name: Run application tests
        run: dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --configuration Release

      - name: Run domain tests
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --configuration Release

      - name: Publish Windows x64
        run: dotnet publish src/SewerScan.UI/SewerScan.UI.csproj -c Release -r win-x64 --self-contained true -o publish/PrefabScan_4.2.4

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/PrefabScan_4.2.4/* -DestinationPath PrefabScan_4.2.4_Windows_x64.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PrefabScan_4.2.4_Windows_x64
          path: PrefabScan_4.2.4_Windows_x64.zip
