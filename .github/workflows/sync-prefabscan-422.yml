name: Test PrefabScan 4.2.2 source

on:
  push:
    branches:
      - sync/prefabscan-4.2.2
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/sync-prefabscan-422.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync/prefabscan-4.2.2
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore test projects
        run: |
          dotnet restore tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj
          dotnet restore tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj

      - name: Run application tests
        run: dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run domain tests
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --no-restore --configuration Release --verbosity normal
