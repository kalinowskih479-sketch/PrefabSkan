name: Sync PrefabScan 4.2.2 source

on:
  push:
    branches:
      - sync/prefabscan-4.2.2
    paths:
      - 'PrefabScan_4.2.2_SOURCE.zip'
      - '.github/workflows/sync-prefabscan-422.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync/prefabscan-4.2.2
          fetch-depth: 0

      - name: Extract 4.2.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import-422
          mkdir .import-422
          unzip -q PrefabScan_4.2.2_SOURCE.zip -d .import-422
          test -d .import-422/PrefabScan_4.2.2/src
          test -d .import-422/PrefabScan_4.2.2/tests
          rsync -a --delete .import-422/PrefabScan_4.2.2/src/ src/
          rsync -a --delete .import-422/PrefabScan_4.2.2/tests/ tests/
          cp .import-422/PrefabScan_4.2.2/PrefabScan.sln ./PrefabScan.sln
          cp .import-422/PrefabScan_4.2.2/PrefabScan.slnx ./PrefabScan.slnx
          cp .import-422/PrefabScan_4.2.2/.gitignore ./.gitignore
          cp .import-422/PrefabScan_4.2.2/README_PREFABSCAN.md ./README_PREFABSCAN.md
          rm -rf .import-422

      - name: Commit synchronized source before tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PrefabScan Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests PrefabScan.sln PrefabScan.slnx .gitignore README_PREFABSCAN.md
          if ! git diff --cached --quiet; then
            git commit -m 'Sync PrefabScan 4.2.2 source and tests'
            git push origin HEAD:sync/prefabscan-4.2.2
          fi

      - name: Show OCR source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '--- OcrFallbackExtractor references ---'
          grep -Rni --include='*.cs' -E 'Pix\.Scale|OcrFallbackExtractor|Scale\(' src tests || true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore test projects
        run: |
          dotnet restore tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj
          dotnet restore tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj

      - name: Run application tests and capture diagnostics
        id: app_tests
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --no-restore --configuration Release --verbosity normal > /tmp/app-test.log 2>&1
          code=$?
          {
            echo 'PrefabScan 4.2.2 application-test diagnostics'
            echo "exit_code=$code"
            echo "commit=$(git rev-parse HEAD)"
            echo '--- errors/failures ---'
            grep -nE 'error (CS|NU|NETSDK|MSB)[0-9]+|error:|Failed!|Failed |Error Message:|Stack Trace:|Test Run Failed|Build FAILED|Unhandled exception' /tmp/app-test.log || true
            echo '--- final 120 lines ---'
            tail -n 120 /tmp/app-test.log
          } > .ci/app-test-error.txt
          cat .ci/app-test-error.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit application test diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'PrefabScan CI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .ci/app-test-error.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: capture PrefabScan 4.2.2 application test failure'
            git push origin HEAD:sync/prefabscan-4.2.2
          fi

      - name: Stop after application test failure
        if: steps.app_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Run domain tests
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --no-restore --configuration Release --verbosity normal
