name: Test and package PrefabScan 4.2.3

on:
  push:
    branches:
      - sync/prefabscan-4.2.2
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/sync-prefabscan-422.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync/prefabscan-4.2.2
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore test projects
        run: |
          dotnet restore tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj
          dotnet restore tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj

      - name: Run application tests
        run: dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run domain tests
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Publish Windows x64
        run: dotnet publish src/SewerScan.UI/SewerScan.UI.csproj -c Release -r win-x64 --self-contained true -o publish/PrefabScan-4.2.3-win-x64

      - name: Create ZIP
        run: |
          cd publish
          zip -r ../PrefabScan_4.2.3_Windows_x64.zip PrefabScan-4.2.3-win-x64

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PrefabScan_4.2.3_Windows_x64
          path: PrefabScan_4.2.3_Windows_x64.zip
          if-no-files-found: error
