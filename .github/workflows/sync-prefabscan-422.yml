name: Test PrefabScan 4.2.2 source

on:
  push:
    branches:
      - sync/prefabscan-4.2.2
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/sync-prefabscan-422.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync/prefabscan-4.2.2
          fetch-depth: 0

      - name: Apply verified parser regression fixes
        shell: python
        run: |
          from pathlib import Path

          parser = Path('src/SewerScan.Infrastructure/Parsers/SewerProjectParser.cs')
          s = parser.read_text(encoding='utf-8-sig')

          replacements = [
              (
                  'if (match.DiameterMm == 0 && mh.DiameterMm > 0)\n                        match.DiameterMm = mh.DiameterMm;',
                  'if (!match.DiameterMm.HasValue && mh.DiameterMm.HasValue && mh.DiameterMm.Value > 0)\n                        match.DiameterMm = mh.DiameterMm;'
              ),
              (
                  'if (match.HeightM == 0 && mh.HeightM > 0)\n                        match.HeightM = mh.HeightM;',
                  'if (!match.HeightM.HasValue && mh.HeightM.HasValue && mh.HeightM.Value > 0)\n                        match.HeightM = mh.HeightM;'
              ),
              (
                  'if (existing.DiameterMm == 0 && diam > 0)\n                        existing.DiameterMm = diam;',
                  'if (!existing.DiameterMm.HasValue && diam > 0)\n                        existing.DiameterMm = diam;'
              ),
              (
                  'if (existing.HeightM == 0 && heightMatch.Success && heightMatch.Groups["h"]?.Success == true)',
                  'if (!existing.HeightM.HasValue && heightMatch.Success && heightMatch.Groups["h"]?.Success == true)'
              ),
              (
                  '''                var repeatedOcrId = identifierOccurrences.TryGetValue(id, out var occurrenceCount) && occurrenceCount >= 2;
                if (isOcr && !directElevations.ContainsKey(id) && !repeatedOcrId)
                {
                    debug.AppendLine($"OCR text fallback rejected {id}: no spatial anchor/elevation pair and occurrences={occurrenceCount}.");
                    continue;
                }''',
                  '''                var acceptedSpatialAnchor = spatialAnchors.Any(a =>
                    string.Equals(a.Identifier, id, StringComparison.OrdinalIgnoreCase));
                var repeatedTextId = identifierOccurrences.TryGetValue(id, out var occurrenceCount) && occurrenceCount >= 2;
                if (isOcr && !directElevations.ContainsKey(id) && !acceptedSpatialAnchor && !repeatedTextId)
                {
                    debug.AppendLine($"OCR text fallback rejected {id}: no accepted spatial anchor/elevation pair and occurrences={occurrenceCount}.");
                    continue;
                }'''
              ),
              (
                  '''                foreach (var a in FindSpatialManholeAnchors(page.Items, result.DrawingType))
                {
                    identifiers.Add(a.Identifier);
                    CountIdentifier(a.Identifier);
                }''',
                  '''                foreach (var a in FindSpatialManholeAnchors(page.Items, result.DrawingType))
                    identifiers.Add(a.Identifier);'''
              ),
              (
                  '''                var left = index <= 0
                    ? anchor.X - Math.Max(45, pageWidth * 0.04)
                    : (ordered[index - 1].X + anchor.X) / 2.0;
                var right = index < 0 || index == ordered.Count - 1
                    ? anchor.X + Math.Max(45, pageWidth * 0.04)
                    : (anchor.X + ordered[index + 1].X) / 2.0;''',
                  '''                var edgeHalfWidth = ordered.Count == 1
                    ? Math.Max(140, pageWidth * 0.65)
                    : Math.Max(45, pageWidth * 0.04);
                var left = index <= 0
                    ? anchor.X - edgeHalfWidth
                    : (ordered[index - 1].X + anchor.X) / 2.0;
                var right = index < 0 || index == ordered.Count - 1
                    ? anchor.X + edgeHalfWidth
                    : (anchor.X + ordered[index + 1].X) / 2.0;'''
              )
          ]

          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
          parser.write_text(s, encoding='utf-8')

          tests = Path('tests/SewerScan.Application.Tests/SewerProjectParserTests.cs')
          t = tests.read_text(encoding='utf-8-sig')
          t = t.replace(
              '''Assert.Equal(134.15, d61.GroundElevationM);
        Assert.Equal(126.47, d61.InvertElevationM);
        Assert.Equal(7.08, d61.HeightM);''',
              '''Assert.Equal(133.55, d61.GroundElevationM);
        Assert.Equal(126.47, d61.InvertElevationM);
        Assert.Equal(7.08, d61.HeightM);''', 1)
          t = t.replace(
              '''Assert.Equal(134.15, d7.GroundElevationM);
        Assert.Equal(126.51, d7.InvertElevationM);
        Assert.Equal(7.14, d7.HeightM);''',
              '''Assert.Equal(133.65, d7.GroundElevationM);
        Assert.Equal(126.51, d7.InvertElevationM);
        Assert.Equal(7.14, d7.HeightM);''', 1)
          tests.write_text(t, encoding='utf-8')

      - name: Persist parser fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PrefabScan Dev Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/SewerScan.Infrastructure/Parsers/SewerProjectParser.cs tests/SewerScan.Application.Tests/SewerProjectParserTests.cs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: harden OCR fallback and local parser context'
            git pull --rebase origin sync/prefabscan-4.2.2
            git push origin HEAD:sync/prefabscan-4.2.2
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore test projects
        run: |
          dotnet restore tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj
          dotnet restore tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj

      - name: Run application tests
        run: dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run domain tests
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --no-restore --configuration Release --verbosity normal
