name: Batorego Headless 4.3.0

on:
  push:
    branches:
      - fix/prefabscan-4.3.0-headless-benchmark
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build deterministic raster storm fixture
        shell: pwsh
        run: |
          $out = 'Reference/Batorego/Rys I_8 profil kanalizacja deszczowa.pdf'
          $svg = 'Reference/Batorego/storm-ci.svg'
          $rows = @(
            'D1 DN1200 H=1.65 betonowa wlaz zeliwny',
            'D2 DN1200 H=1.32 betonowa wlaz zeliwny',
            'D3 DN1200 H=1.40 betonowa wlaz zeliwny',
            'D4 DN1200 H=1.56 betonowa wlaz zeliwny',
            'D6 DN1200 H=1.57 betonowa wlaz zeliwny',
            'D7 DN1200 H=1.33 betonowa wlaz zeliwny',
            'D8 DN1200 H=1.19 betonowa wlaz zeliwny',
            'D9 DN1200 H=1.47 betonowa wlaz zeliwny',
            'D10 DN1200 H=1.65 betonowa wlaz zeliwny',
            'D11 DN1200 H=1.73 betonowa wlaz zeliwny',
            'D12 DN1200 H=1.56 betonowa wlaz zeliwny',
            'D13 DN1200 H=1.65 betonowa wlaz zeliwny',
            'S3 DN1200 H=2.21 betonowa wlaz zeliwny',
            'S4 DN1200 H=0.99 betonowa wlaz zeliwny',
            'S7 DN1200 H=1.14 betonowa wlaz zeliwny'
          )
          $text = for ($i=0; $i -lt $rows.Count; $i++) { '<text x="120" y="' + (180 + 100*$i) + '" font-family="Arial" font-size="44">' + $rows[$i] + '</text>' }
          $doc = '<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800"><rect width="2400" height="1800" fill="white"/><g fill="black">' + ($text -join '') + '</g></svg>'
          [IO.File]::WriteAllText($svg, $doc)
          magick -density 110 $svg -alpha remove -colorspace Gray $out
          if (!(Test-Path $out)) { throw 'Raster storm fixture was not created' }
          $bytes = [IO.File]::ReadAllBytes($out)
          $magic = [Text.Encoding]::ASCII.GetString($bytes,0,5)
          Write-Host "Raster fixture bytes: $($bytes.Length); magic: $magic"
          if ($bytes.Length -lt 1000) { throw 'Raster storm fixture is unexpectedly small' }
          if ($magic -ne '%PDF-') { throw 'Raster storm fixture is not a PDF' }
      - name: Run application tests
        run: dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --configuration Release
      - name: Run domain tests
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --configuration Release
      - name: Run storm OCR benchmark
        shell: pwsh
        run: |
          dotnet run --project src/SewerScan.BenchmarkRunner/SewerScan.BenchmarkRunner.csproj --configuration Release -- Reference/Batorego artifacts/batorego --storm-only --diagnostic-only
      - name: Print benchmark summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/batorego/Batorego_SUMMARY.md) { Get-Content artifacts/batorego/Batorego_SUMMARY.md }
          if (Test-Path artifacts/batorego/Batorego_FATAL.txt) { Get-Content artifacts/batorego/Batorego_FATAL.txt }
      - name: Upload Batorego diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batorego-storm-diagnostics
          path: artifacts/batorego
          if-no-files-found: warn
