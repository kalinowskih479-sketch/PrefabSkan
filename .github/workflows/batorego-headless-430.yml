name: Batorego Headless 4.3.0

on:
  push:
    branches:
      - fix/prefabscan-4.3.0-headless-benchmark
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild storm fixture
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'Reference/BatoregoPayload/storm.part*.b64' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 storm payload parts, got $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $pdf = 'Reference/Batorego/Rys I_8 profil kanalizacja deszczowa.pdf'
          [IO.File]::WriteAllBytes($pdf, $bytes)
          $magic = [Text.Encoding]::ASCII.GetString($bytes, 0, 5)
          $tail = [Text.Encoding]::ASCII.GetString($bytes, [Math]::Max(0,$bytes.Length-2048), [Math]::Min(2048,$bytes.Length))
          Write-Host "Storm fixture rebuilt bytes: $($bytes.Length); magic: $magic"
          if ($bytes.Length -ne 47823) { throw "Unexpected storm fixture size: $($bytes.Length)" }
          if ($magic -ne '%PDF-') { throw 'Storm fixture is not a PDF' }
          if (!$tail.Contains('%%EOF')) { throw 'Storm fixture has no EOF marker' }
      - name: Run application tests
        run: dotnet test tests/SewerScan.Application.Tests/SewerScan.Application.Tests.csproj --configuration Release
      - name: Run domain tests
        run: dotnet test tests/SewerScan.Domain.Tests/SewerScan.Domain.Tests.csproj --configuration Release
      - name: Run storm OCR benchmark
        shell: pwsh
        run: |
          dotnet run --project src/SewerScan.BenchmarkRunner/SewerScan.BenchmarkRunner.csproj --configuration Release -- Reference/Batorego artifacts/batorego --storm-only --diagnostic-only
      - name: Print benchmark summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/batorego/Batorego_SUMMARY.md) { Get-Content artifacts/batorego/Batorego_SUMMARY.md }
          if (Test-Path artifacts/batorego/Batorego_FATAL.txt) { Get-Content artifacts/batorego/Batorego_FATAL.txt }
      - name: Upload Batorego diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batorego-storm-diagnostics
          path: artifacts/batorego
          if-no-files-found: warn
